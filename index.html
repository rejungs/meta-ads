<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meta Ads Master Studio & Creator Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-green-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide text-white">AI Meta Ads Master Studio</h1>
                    <p class="text-xs text-slate-400" id="sub-title">125+ Meta Ads Master Catalog & AI Generator</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Language Selector -->
                <div class="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
                    <button onclick="setLanguage('en')" id="lang-en" class="px-3 py-1.5 rounded-md text-xs font-medium transition bg-green-600 text-white shadow">English</button>
                    <button onclick="setLanguage('tl')" id="lang-tl" class="px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-white">Tagalog</button>
                    <button onclick="setLanguage('ceb')" id="lang-ceb" class="px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-white">Bisaya</button>
                </div>
                
                <!-- API Key Modal Trigger -->
                <button onclick="openApiKeyModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 transition">
                    <i class="fa-solid fa-key text-yellow-400"></i>
                    <span id="btn-api-key">Gemini Key</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left / Center: Generator & Categories -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- AI Generator Box -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <h2 class="text-lg font-bold text-white flex items-center gap-2 mb-4">
                    <i class="fa-solid fa-robot text-green-400"></i>
                    <span id="gen-heading">AI Ad Concept & Script Generator</span>
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" id="lbl-product">Product / Service / Niche Description</label>
                        <input type="text" id="ai-product" placeholder="e.g., Luxury watch, Skincare, E-commerce gadget..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-green-500 transition">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" id="lbl-category">Category & Master Style</label>
                            <select id="ai-category-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition">
                                <option value="Product Showcase">1. Product Showcase & Luxury</option>
                                <option value="Cinematic & AI Video">2. Cinematic & AI-Generated Ads</option>
                                <option value="Direct Response & Sales">3. Direct Response & Sales</option>
                                <option value="UGC & Testimonials">4. UGC, Influencer & Testimonial</option>
                                <option value="Storytelling & Emotion">5. Storytelling, Emotion & Skits</option>
                                <option value="Presenter & AI Avatar">6. Presenter & AI Characters</option>
                                <option value="Design & Typography">7. Design, Graphic & Typography</option>
                                <option value="Photography & Lifestyle">8. Photography & Lifestyle</option>
                                <option value="Industry-Specific">9. Industry-Specific Ads</option>
                                <option value="Hooks & Frameworks">10. Hooks & Conversion Frameworks</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" id="lbl-goal">Video Duration / Type</label>
                            <select id="ai-duration" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-green-500 transition">
                                <option value="30s">30-Second Reel / Short Ad</option>
                                <option value="15s">15-Second Fast Hook</option>
                                <option value="60s">60-Second Deep Dive / Story</option>
                                <option value="2min">2-Minute Detailed Presentation</option>
                            </select>
                        </div>
                    </div>
                    
                    <button onclick="generateWithAI()" class="w-full bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span id="btn-generate">Generate AI Ad Package</span>
                    </button>
                </div>
                
                <!-- AI Output Display -->
                <div id="ai-output-container" class="mt-6 hidden border border-slate-800 bg-slate-950/70 rounded-xl p-4 relative">
                    <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                        <span class="text-xs font-bold text-green-400 uppercase tracking-wider" id="lbl-result">Generated Output</span>
                        <div class="flex items-center gap-2">
                            <button onclick="saveCurrentOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-green-400 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-solid fa-bookmark"></i> <span id="btn-save-out">Save</span>
                            </button>
                            <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-regular fa-copy"></i> <span id="btn-copy">Copy</span>
                            </button>
                        </div>
                    </div>
                    <div id="ai-result-content" class="text-sm text-slate-200 whitespace-pre-wrap font-mono leading-relaxed"></div>
                </div>
            </section>

            <!-- Master Catalog Section -->
            <section class="space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-green-400"></i>
                        <span id="lib-heading">10-Category Master Catalog</span>
                    </h2>
                    
                    <div class="flex flex-wrap gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 max-h-36 overflow-y-auto">
                        <button onclick="filterCatalog('all')" id="cat-all" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-green-600 text-white transition">All</button>
                        <button onclick="filterCatalog('Product')" id="cat-prod" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Product</button>
                        <button onclick="filterCatalog('Cinematic')" id="cat-cine" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Cinematic</button>
                        <button onclick="filterCatalog('Direct')" id="cat-dir" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Direct</button>
                        <button onclick="filterCatalog('UGC')" id="cat-ugc" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">UGC</button>
                        <button onclick="filterCatalog('Story')" id="cat-stor" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Story</button>
                        <button onclick="filterCatalog('Presenter')" id="cat-pres" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Presenter</button>
                        <button onclick="filterCatalog('Design')" id="cat-desi" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Design</button>
                        <button onclick="filterCatalog('Photo')" id="cat-phot" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Photo</button>
                        <button onclick="filterCatalog('Industry')" id="cat-indu" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Industry</button>
                        <button onclick="filterCatalog('Hook')" id="cat-hook" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">Hooks</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[600px] overflow-y-auto pr-2" id="catalog-grid"></div>
            </section>
        </div>

        <!-- Right Sidebar: Saved Scripts -->
        <div class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-bookmark text-green-400"></i>
                        <span id="saved-heading">Saved Scripts</span>
                    </h3>
                    <button onclick="clearSaved()" class="text-xs text-slate-400 hover:text-red-400 transition" id="btn-clear">Clear All</button>
                </div>
                <div id="saved-list" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 italic text-center py-4" id="no-saved">No saved scripts yet.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- API Key Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-key text-yellow-400"></i> Set Gemini API Key
            </h3>
            <p class="text-xs text-slate-400">Pagsulod sa imong Google Gemini API key aron moandar ang AI Generator.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-green-500">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeApiKeyModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white bg-slate-800 transition">Cancel</button>
                <button onclick="saveApiKey()" class="px-4 py-2 rounded-xl text-xs font-medium bg-green-600 text-white hover:bg-green-500 transition">Save Key</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'ceb';
        let currentFilter = 'all';

        const translations = {
            en: { subTitle: "125+ Meta Ads Master Catalog & AI Generator", btnApiKey: "Gemini Key", genHeading: "AI Ad Concept & Script Generator", lblProduct: "Product / Service / Niche Description", lblCategory: "Master Ad Category", lblGoal: "Video Duration / Type", btnGenerate: "Generate AI Ad Package", lblResult: "Generated Output", btnCopy: "Copy", btnSaveOut: "Save", libHeading: "10-Category Master Catalog", savedHeading: "Saved Scripts", btnClear: "Clear All", noSaved: "No saved scripts yet." },
            tl: { subTitle: "125+ Meta Ads Master Catalog at AI Generator", btnApiKey: "Gemini Key", genHeading: "AI Ad Concept & Script Generator", lblProduct: "Paglalarawan ng Produkto / Serbisyo / Niche", lblCategory: "Kategorya ng Ad", lblGoal: "Tagal ng Video / Uri", btnGenerate: "Gumawa ng AI Ad Package", lblResult: "Resulta ng AI", btnCopy: "Kopyahin", btnSaveOut: "I-save", libHeading: "10-Category Master Catalog", savedHeading: "Mga Naka-save na Script", btnClear: "Burahin Lahat", noSaved: "Wala pang naka-save na script." },
            ceb: { subTitle: "125+ Meta Ads Master Catalog ug AI Generator", btnApiKey: "Gemini Key", genHeading: "AI Ad Concept & Script Generator", lblProduct: "Paghulagway sa Produkto / Serbisyo / Niche", lblCategory: "Master Ad Category", lblGoal: "Gitas-on sa Video / Uri", btnGenerate: "Paghimo og AI Ad Package", lblResult: "Resulta sa AI", btnCopy: "Kopya", btnSaveOut: "I-save", libHeading: "10-Category Master Catalog", savedHeading: "Mga Na-save nga Script", btnClear: "Pag-clear Tanan", noSaved: "Wala pa nay na-save nga script." }
        };

        const masterCatalog = [
            { id: 1, cat: 'Product', name: 'Clean Product Photography & Showcase', desc: 'Pagpakita sa produkto ug sa iyang features gamit ang limpyo nga studio lighting.' },
            { id: 2, cat: 'Product', name: 'Luxury Editorial & Cinematic', desc: 'Para sa perfume, watches, jewelry, ug premium high-end products.' },
            { id: 3, cat: 'Cinematic', name: '3D CGI & Floating Product Effect', desc: 'Mga visual effects nga makadani dayon sa mata sa mga users sa feed.' },
            { id: 4, cat: 'Cinematic', name: 'Hollywood Cinematic Brand Film', desc: 'Slow-motion commercial, dramatic lighting, ug epic drone shots.' },
            { id: 5, cat: 'Direct', name: 'Direct Response & PAS Framework', desc: 'Problem-Agitate-Solve ug tinuod nga direct sales conversion.' },
            { id: 6, cat: 'Direct', name: 'Offer, Discount & Flash Sale Ads', desc: 'Promo, time-limited promotion, ug bundles.' },
            { id: 7, cat: 'UGC', name: 'Selfie Review & Unboxing (9:16)', desc: 'Mukhang organic ug gawa sa totoong customer o creator.' },
            { id: 8, cat: 'UGC', name: 'Customer Testimonial & Social Proof', desc: 'Success stories ug real results demonstration.' },
            { id: 9, cat: 'Story', name: 'Emotional Storytelling & Skits', desc: 'Makapukaw sa pagbati, comedy, ug adlaw-adlaw nga relasyon.' },
            { id: 10, cat: 'Story', name: 'Founder Journey & Origin Story', desc: 'Istorya sa founder ug giunsa pagsugod ang brand.' },
            { id: 11, cat: 'Presenter', name: 'Founder-Led / Talking Head Presentation', desc: 'Ang may-ari mismo ang nagsasalita sa camera.' },
            { id: 12, cat: 'Presenter', name: 'AI Human Avatar & Virtual Influencer', desc: 'Gamit ang AI avatars, lip-sync, ug digital brand ambassadors.' },
            { id: 13, cat: 'Design', name: 'Bold Typography & Minimalist Graphic', desc: 'Dagko ug kusog nga text, editorial layout, ug kinetic typography.' },
            { id: 14, cat: 'Photo', name: 'Lifestyle & Environmental Photography', desc: 'Product in everyday life, outdoor, ug studio settings.' },
            { id: 15, cat: 'Industry', name: 'E-commerce, Real Estate & SaaS Demos', desc: 'Espesyal nga estratehiya para sa fitness, restaurants, real estate, ug apps.' },
            { id: 16, cat: 'Hook', name: 'Question, Curiosity & Myth-Busting Hooks', desc: 'Mga unang 3-segundo nga pormat para dili mag-scroll ang user.' }
        ];

        function setLanguage(lang) {
            currentLang = lang;
            ['en', 'tl', 'ceb'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition bg-green-600 text-white shadow";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-white";
                }
            });

            const t = translations[lang];
            document.getElementById('sub-title').innerText = t.subTitle;
            document.getElementById('btn-api-key').innerText = t.btnApiKey;
            document.getElementById('gen-heading').innerText = t.genHeading;
            document.getElementById('lbl-product').innerText = t.lblProduct;
            document.getElementById('lbl-category').innerText = t.lblCategory;
            document.getElementById('lbl-goal').innerText = t.lblGoal;
            document.getElementById('btn-generate').innerText = t.btnGenerate;
            document.getElementById('lbl-result').innerText = t.lblResult;
            document.getElementById('btn-copy').innerText = t.btnCopy;
            document.getElementById('btn-save-out').innerText = t.btnSaveOut;
            document.getElementById('lib-heading').innerText = t.libHeading;
            document.getElementById('saved-heading').innerText = t.savedHeading;
            document.getElementById('btn-clear').innerText = t.btnClear;
            document.getElementById('no-saved').innerText = t.noSaved;

            renderCatalog();
            renderSaved();
        }

        function filterCatalog(cat) {
            currentFilter = cat;
            renderCatalog();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            const filtered = currentFilter === 'all' ? masterCatalog : masterCatalog.filter(item => item.cat === currentFilter);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 hover:border-slate-700 transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-white text-xs">${item.name}</h3>
                            <span class="text-[9px] bg-slate-800 text-green-400 px-2 py-0.5 rounded-full font-medium">${item.cat}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mb-3">${item.desc}</p>
                    </div>
                    <button onclick="useCatalogItem('${item.name}')" class="w-full bg-slate-800 hover:bg-slate-700 text-xs font-medium py-1.5 rounded-xl text-slate-200 transition">
                        <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Use in AI Generator
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function useCatalogItem(name) {
            document.getElementById('ai-product').value = name;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function generateWithAI() {
            const product = document.getElementById('ai-product').value.trim();
            const category = document.getElementById('ai-category-select').value;
            const duration = document.getElementById('ai-duration').value;
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!product) {
                alert("Palihug og butang og produkto o niche una sa text box.");
                return;
            }

            const outputContainer = document.getElementById('ai-output-container');
            const resultContent = document.getElementById('ai-result-content');
            outputContainer.classList.remove('hidden');
            resultContent.innerText = "Nag-generate ang AI ad package... Palihug maghulat kadiyot...";

            if (!apiKey || apiKey.length < 10) {
                setTimeout(() => {
                    resultContent.innerText = `[AI Meta Ads Master Studio - ${currentLang.toUpperCase()}]\n\nPRODUCT/NICHE: ${product}\nCATEGORY STYLE: ${category} (${duration})\n\n1. 3-SECOND VIRAL HOOKS:\n- "Gisulayan nako ni para sa akong negosyo ug grabe ang resulta!"\n- "Stop scrolling kung gusto nimo masulbad kining problemaha..."\n\n2. COMPLETE AD SCRIPT FLOW:\n- Hook (0-3s): High-converting attention grabber.\n- Body (3-20s): Deep dive utilizing ${category} creative framework.\n- Call to Action (20-30s): Click link below to claim your offer!\n\n3. AI VIDEO & IMAGE PROMPTS (Seedance / Video Express):\nVertical 9:16, 4k cinematic resolution, professional studio lighting, showing ${product} in action.`;
                }, 600);
                return;
            }

            try {
                const promptText = `Act as an expert Meta Ads copywriter and AI video prompt engineer. Create a high-converting ad package in language '${currentLang}' for: "${product}" using master category style "${category}" (${duration}). Provide 3-second hooks, a complete voiceover script, and AI visual prompts.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultContent.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultContent.innerText = "Wala nigawas ang tubag gikan sa Gemini API.";
                }
            } catch (err) {
                resultContent.innerText = "Error sa pag-connect sa API: " + err.message;
            }
        }

        function copyOutput() {
            navigator.clipboard.writeText(document.getElementById('ai-result-content').innerText);
            alert("Nakopya na sa clipboard!");
        }

        function saveCurrentOutput() {
            const text = document.getElementById('ai-result-content').innerText;
            const product = document.getElementById('ai-product').value || "AI Meta Ad Script";
            if (!text || text.includes("Nag-generate")) return;
            let saved = JSON.parse(localStorage.getItem('saved_scripts') || '[]');
            saved.push({ title: product.substring(0, 30), content: text, date: new Date().toLocaleDateString() });
            localStorage.setItem('saved_scripts', JSON.stringify(saved));
            renderSaved();
            alert("Na-save na sa imong Swipe File list!");
        }

        function openApiKeyModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function closeApiKeyModal() { document.getElementById('api-modal').classList.add('hidden'); }
        function saveApiKey() {
            localStorage.setItem('gemini_api_key', document.getElementById('api-key-input').value.trim());
            closeApiKeyModal();
            alert("Na-save na ang imong API key!");
        }

        function renderSaved() {
            const list = document.getElementById('saved-list');
            let saved = JSON.parse(localStorage.getItem('saved_scripts') || '[]');
            if (saved.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-4">Wala pa nay na-save nga script.</p>`;
                return;
            }
            list.innerHTML = '';
            saved.forEach((item) => {
                const div = document.createElement('div');
                div.className = "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1";
                div.innerHTML = `<div class="flex justify-between items-center"><span class="font-bold text-white">${item.title}</span><span class="text-[10px] text-slate-500">${item.date}</span></div><p class="text-slate-400 truncate">${item.content.split('\n')[0]}</p>`;
                list.appendChild(div);
            });
        }

        function clearSaved() {
            localStorage.removeItem('saved_scripts');
            renderSaved();
        }

        setLanguage('ceb');
    </script>
</body>
</html>
